task = "coach.check_retry"
source = "docs/product/conversation-rules.md §7 ⑥ / ③"

[request]
intent = "最近私はAIエージェントを作ることに興味があるから、それに関係するサービスを勉強してるよ。"
sentence = "I'm interested in building AI agents these days, so I'm starting AWS services related to them."
submission_number = 1
conversation = []

[request.feedback]
first_line = "意図は伝わっています"
sentence = "I'm interested in creating AI agents recently, so I'm studying AWS services related to AI."
template = "I'm interested in (①) ____ AI agents (②) ____, so I'm studying AWS services related to (③) ____."
request_line = "空欄を埋めて、文全体をもう一度書いてください"
fixes = [
  { number = 1, original = "creating", replacement = "building", reason = "元のままでも通じる。エージェントやアプリを「作る」は build がよく使われる", tag = "improvement" },
  { number = 2, original = "recently", replacement = "these days", reason = "recently は過去形や現在完了と組む。今の状態の「最近」は these days", tag = "miss" },
  { number = 3, original = "AI", replacement = "them", reason = "元のままでも通じる。「それ（AI エージェント）」なので them で受ける", tag = "improvement" },
]

[[expect]]
kind = "reading_noted"
heard = "starting"
read_as = "studying"

[[expect]]
kind = "accepted"
