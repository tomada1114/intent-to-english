name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Each push to main
  # gets a group of its own (its SHA), so none is cancelled, even while pending.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --locked

      # Both groups must finish successfully; recipe commands remain verbatim.
      - name: Run independent checks
        run: |
          set -euo pipefail
          (
            PYTHONDONTWRITEBYTECODE=1 uv run --locked pytest -n auto -p no:cacheprovider .agents/skills/*/scripts/tests
          ) &
          skills_pid=$!
          (
            uv run --locked python scripts/sync_agents.py --check
            uv run --locked ruff check .
            uv run --locked ruff format --check .
            uv run --locked mypy
            uv run --locked pre-commit run shellcheck --all-files
          ) &
          lint_pid=$!
          status=0
          wait "$skills_pid" || status=$?
          wait "$lint_pid" || status=$?
          exit "$status"

      # `just backend lint` (backend::lint), which runs in backend/ with
      # backend/pyproject.toml's config; the lines stay verbatim.
      - name: Lint and type-check the backend
        working-directory: backend
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy

  # Skill scripts promise to run on the system python3; 3.9 is macOS's
  # /usr/bin/python3. Stdlib only, so no project environment. Not a required
  # check: a failure leaves the PR UNSTABLE, which automated merges stop on.
  skill-scripts-py39:
    name: Skill Scripts (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Skill script tests under Python 3.9
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          UV_PYTHON_DOWNLOADS: automatic
        run: |
          uv run --no-project --python 3.9 python --version
          status=0
          for dir in .agents/skills/*/scripts/tests; do
            echo "== $dir"
            uv run --no-project --python 3.9 python -m unittest discover -s "$dir" -t "$dir" -p 'test_*.py' || status=1
          done
          exit "$status"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Install the recipe integration test runner
        # Recipe integration tests execute Just, using the same pin as the
        # recipe-running jobs. The Python-only runner otherwise lacks it.
        run: |
          uv tool install rust-just==1.47.1
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      # `just test`: the root suite, and backend::test (`just backend test`), the
      # app's suite with the coverage floor, run in backend/. Lines stay verbatim.
      - name: Run the root tests
        run: uv run --locked pytest -n auto

      - name: Run the backend tests and enforce coverage
        working-directory: backend
        run: uv run --locked pytest -n auto --cov --cov-report=term-missing:skip-covered --cov-fail-under=80

  # `just frontend lint`, `test`, and `build` run as recipes, so CI cannot drift
  # from them. pnpm/action-setup reads the pnpm version from package.json's
  # packageManager, and runs before setup-node, whose pnpm cache needs pnpm on
  # PATH; setup-node installs the Node.js .node-version names, the one
  # devEngines.runtime admits. --frozen-lockfile fails when a package.json and
  # pnpm-lock.yaml disagree.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check the frontend
        run: uvx --from rust-just==1.47.1 just frontend lint

      - name: Run the frontend tests and enforce coverage
        run: uvx --from rust-just==1.47.1 just frontend test

      - name: Build the frontend
        run: uvx --from rust-just==1.47.1 just frontend build

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          # Public fixture value for this disposable test service; never reuse it.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intent_to_english_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the default dependencies
        run: uv sync --group dev --locked --package intent-to-english
      - name: Migrate PostgreSQL through the development recipe
        env:
          INTENT_TO_ENGLISH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/intent_to_english_test
        run: uvx --from rust-just==1.47.1 just backend db-upgrade
      - name: Run the PostgreSQL contract and migrations
        env:
          INTENT_TO_ENGLISH_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/intent_to_english_test
        run: uv run --locked --directory backend --extra postgres pytest -v -m postgres tests

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Spell check
        run: uv run --locked pre-commit run typos --all-files

  zizmor:
    name: Workflow Security Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG: zizmor=info
        run: uv run --locked pre-commit run zizmor --all-files --verbose

  contract-drift:
    name: Contract Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the backend dependencies
        run: uv sync --group dev --locked --package intent-to-english
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the committed API contract
        run: uvx --from rust-just==1.47.1 just contract-check

  # `just e2e`: Playwright drives the built screen in Chromium against the real
  # API on a throwaway SQLite file (e2e/playwright.config.ts). `just e2e-lint`
  # is `just verify`'s Biome and tsc over e2e/ (through `lint`). Chromium is
  # downloaded on every run, never cached: Playwright's CI guide finds a restore
  # about as slow as the download, and --with-deps' OS packages cannot be
  # cached. The traces and the HTML report are uploaded only when a step failed.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install the backend dependencies
        run: uv sync --group dev --locked --package intent-to-english

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check the e2e tests
        run: uvx --from rust-just==1.47.1 just e2e-lint

      - name: Install Chromium and its OS dependencies
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Run the browser test
        run: uvx --from rust-just==1.47.1 just e2e

      - name: Upload the traces and the HTML report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The one CI context .github/rulesets/main.json requires. It needs every
  # gating job above and fails unless each succeeded, so a new gating job joins
  # `needs:` and the failing step's `if:`, never the ruleset; a job that does
  # not gate is exempted, with its reason, in tests/harness/test_ci_aggregate.py.
  # `always()` runs it when a needed job failed, was skipped, or was cancelled,
  # each of which fails it. Not `!cancelled()`: that skips it on a cancelled
  # run, and a skipped required check reports success. A run a newer push
  # cancelled fails here on its old commit; the newer run reports the head.
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [lint, coverage, frontend, postgres, spell-check, zizmor, contract-drift, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report each needed job's result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"

      # One `needs.<job>.result != 'success'` term per needed job, never
      # `needs.*` or contains(): tests/harness/_needs.py reads only this shape.
      - name: Fail unless every needed job succeeded
        if: >-
          ${{ needs.lint.result != 'success' || needs.coverage.result != 'success'
          || needs.frontend.result != 'success' || needs.postgres.result != 'success'
          || needs.spell-check.result != 'success' || needs.zizmor.result != 'success'
          || needs.contract-drift.result != 'success' || needs.e2e.result != 'success' }}
        run: |
          echo "::error::a job CI result needs did not succeed; its result is above"
          exit 1
